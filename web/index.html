<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="自炊・外食のPFCバランスとカロリー収支をスマートに管理できるアプリ">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PFC Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PFC Tracker - カロリー＆PFC管理</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload Critical Flutter Web Assets -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F9FAFB;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans CJK JP", sans-serif;
    }
    #app-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F9FAFB;
      z-index: 99999;
      transition: opacity 0.25s ease-out;
    }
    #app-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .splash-title {
      font-size: 20px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #E5E7EB;
      border-top-color: #10B981;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <div class="splash-title">PFC Tracker</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    // Flutterの描画準備が整った際にDart側またはタイマーから呼び出してスムーズに非表示にする
    window.removeAppSplash = function() {
      var splash = document.getElementById('app-splash');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 260);
      }
    };
    // 万が一スクリプト停止などが発生しても最大15秒で自動解除するフェイルセーフ
    setTimeout(function() {
      window.removeAppSplash();
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
